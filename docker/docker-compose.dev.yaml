services:
  db:
    image: postgis/postgis:15-3.4
    container_name: srms-pg
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_MULTIPLE_EXTENSIONS: postgis,postgis_topology
    networks:
      mars:
        ipv4_address: 175.20.1.3
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
  minio:
    ports:
      - 9000:9000
      - 9001:9001
    container_name: minio-srms
    networks:
      mars:
        ipv4_address: 175.20.1.5
    volumes:
      - /home/gscwd/minio-srms/data:/data
    environment:
      - MINIO_ROOT_USER=${MINIO_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_PASS}
    image: quay.io/minio/minio
    command: server /data --console-address ":9001"
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    networks:
      mars:
        ipv4_address: 175.20.1.4
    ports:
      - 2782:80
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PG_ADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PG_ADMIN_PASSWORD}
volumes:
  data:
  geoserver-data:
  geoserver-extensions:
networks:
  mars:
    name: mars
    ipam:
      driver: default
      config:
        - subnet: "175.20.1.0/24"
